<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Yoo Juno · 로보틱스·컴퓨터비전 개발자</title>
    <meta
      name="description"
      content="로보틱스·컴퓨터비전·임베디드 중심의 시스템 통합 개발자 유준호 포트폴리오"
    />
    <link rel="icon" href="/favicon.ico" />
    <link rel="canonical" href="https://yoojuno.github.io/" />

    <!-- SNS 링크 미리보기용 정적 태그.
         카카오톡/슬랙/X 등의 크롤러는 JS를 실행하지 않아 라우트별 값을 읽지 못한다.
         따라서 사이트 공통 값으로 고정한다. (라우트별 title/description은
         src/hooks/useDocumentTitle.js 가 담당하며 검색엔진·브라우저에만 반영된다.)
         TODO: og:image 는 1200x630 브랜드 카드로 교체 권장. 현재는 기존 이미지 임시 사용. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Yoo Juno" />
    <meta property="og:title" content="Yoo Juno · 로보틱스·컴퓨터비전 개발자" />
    <meta
      property="og:description"
      content="로보틱스·컴퓨터비전·임베디드 중심의 시스템 통합 개발자 유준호 포트폴리오"
    />
    <meta property="og:url" content="https://yoojuno.github.io/" />
    <meta
      property="og:image"
      content="https://yoojuno.github.io/content/portfolio/smart_factory/system_architecture.png"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var redirect = sessionStorage.getItem('spa-redirect')
        if (redirect) {
          sessionStorage.removeItem('spa-redirect')
          window.history.replaceState(null, '', redirect)
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
