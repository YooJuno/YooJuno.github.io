<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Yoo Juno · 로보틱스·컴퓨터비전 개발자</title>
    <meta
      name="description"
      content="로보틱스·컴퓨터비전·임베디드 중심의 시스템 통합 개발자 유준호 포트폴리오"
    />
    <link rel="icon" href="/favicon.ico" />
    <link rel="canonical" href="https://yoojuno.github.io/" />

    <!-- 아래 값은 홈(/)의 기본값이다.
         빌드 시 vite.config.js 의 프리렌더 플러그인이 라우트마다 이 HTML 을 복사하면서
         title/description/canonical/og 를 해당 경로 값으로 바꾼다. 따라서 JS 를
         실행하지 않는 SNS 크롤러도 글마다 다른 링크 미리보기를 얻는다.
         값의 출처는 src/lib/routeMeta.js 와 각 글의 Frontmatter 다.
         og:image 는 전 페이지 공통 브랜드 카드(public/og-card.png, 1200x630)를 쓴다. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Yoo Juno" />
    <meta property="og:title" content="Yoo Juno · 로보틱스·컴퓨터비전 개발자" />
    <meta
      property="og:description"
      content="로보틱스·컴퓨터비전·임베디드 중심의 시스템 통합 개발자 유준호 포트폴리오"
    />
    <meta property="og:url" content="https://yoojuno.github.io/" />
    <meta property="og:image" content="https://yoojuno.github.io/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="유준호 · 로보틱스, 컴퓨터 비전, 임베디드 개발자 소개 카드"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://yoojuno.github.io/og-card.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var redirect = sessionStorage.getItem('spa-redirect')
        if (redirect) {
          sessionStorage.removeItem('spa-redirect')
          window.history.replaceState(null, '', redirect)
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
