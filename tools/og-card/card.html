<!--
  public/og-card.png (1200x630) 의 원본이다.

  문구나 색을 바꾼 뒤 아래 명령으로 다시 만든다.

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless --disable-gpu --hide-scrollbars \
      --window-size=1200,630 --virtual-time-budget=8000 \
      --screenshot=public/og-card.png tools/og-card/card.html

  렌더 직후 파일은 130KB 정도다. 팔레트를 128색으로 줄이면 눈에 띄는 손실 없이
  56KB 로 줄어든다.

    python3 -c "from PIL import Image; im=Image.open('public/og-card.png').convert('RGB'); \
      im.quantize(colors=128).save('public/og-card.png', optimize=True)"

  색상은 src/styles/base.css 의 토큰(--ink, --accent, --bg)과 맞춰야 한다.
  우측 곡선은 SLAM 궤적과 랜드마크를 뜻하는 장식이다.
-->
<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1200px; height: 630px; }
body {
  font-family: "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
  -webkit-font-smoothing: antialiased;
  letter-spacing: -0.02em;
}
.card { width: 1200px; height: 630px; position: relative; overflow: hidden; display: flex; }
.mark {
  display: grid; place-items: center;
  width: 68px; height: 68px; border-radius: 16px;
  font-family: "Space Grotesk", sans-serif; font-weight: 700;
  font-size: 26px; letter-spacing: -0.04em;
}
.eyebrow {
  font-family: "Space Grotesk", sans-serif; font-weight: 600;
  font-size: 21px; letter-spacing: 0.02em;
}
h1 { font-size: 96px; font-weight: 700; line-height: 1.05; letter-spacing: -0.045em; }
.lead { font-size: 27px; font-weight: 400; line-height: 1.5; }
.url { font-family: "Space Grotesk", sans-serif; font-size: 21px; font-weight: 500; letter-spacing: -0.01em; }
</style>
<style>
.card { background:#f6f7f9; flex-direction:column; justify-content:space-between; padding:76px 84px; }
.card::after{content:"";position:absolute;right:-180px;top:-200px;width:640px;height:640px;border-radius:50%;background:radial-gradient(circle,#dbe3ff 0%,rgba(219,227,255,0) 70%);z-index:1;}
.motif { position:absolute; right:0; top:0; width:520px; height:630px; z-index:0; }
.top { display:flex; align-items:center; gap:20px; position:relative; z-index:2; }
.mark { background:#161b22; color:#fff; }
.name { font-family:"Space Grotesk",sans-serif; font-weight:600; font-size:26px; color:#161b22; }
.mid { position:relative; z-index:2; }
.eyebrow { color:#3157d5; margin-bottom:20px; }
h1 { color:#161b22; }
.rule { width:76px; height:5px; background:#3157d5; border-radius:99px; margin:28px 0; }
.lead { color:#667085; max-width:700px; }
.bot { display:flex; justify-content:space-between; align-items:flex-end; position:relative; z-index:2; }
.url { color:#667085; }
.tags { display:flex; gap:10px; }
.tags span { font-size:17px; font-weight:500; color:#3157d5; background:#fff; border:1px solid #dbe3ff; padding:8px 16px; border-radius:99px; }
</style></head><body>
<div class="card">
  <svg class="motif" viewBox="0 0 520 630" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
        <path d="M34 0H0V34" stroke="#3157d5" stroke-opacity="0.10" stroke-width="1"/>
      </pattern>
      <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#fff" stop-opacity="0"/>
        <stop offset="0.45" stop-color="#fff" stop-opacity="1"/>
      </linearGradient>
      <mask id="m"><rect width="520" height="630" fill="url(#fade)"/></mask>
    </defs>
    <g mask="url(#m)">
      <rect width="520" height="630" fill="url(#grid)"/>
      <!-- SLAM 궤적 -->
      <path d="M40 520 C 130 470, 120 360, 210 320 S 330 250, 360 150 S 430 70, 500 60"
            stroke="#3157d5" stroke-opacity="0.45" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 11"/>
      <path d="M40 520 C 130 470, 120 360, 210 320 S 330 250, 360 150 S 430 70, 500 60"
            stroke="#3157d5" stroke-opacity="0.16" stroke-width="2.5" stroke-linecap="round"/>
      <!-- 웨이포인트 -->
      <circle cx="40" cy="520" r="7" fill="#3157d5" fill-opacity="0.5"/>
      <circle cx="210" cy="320" r="9" fill="#3157d5" fill-opacity="0.5"/>
      <circle cx="360" cy="150" r="7" fill="#3157d5" fill-opacity="0.5"/>
      <circle cx="210" cy="320" r="22" stroke="#3157d5" stroke-opacity="0.28" stroke-width="2"/>
      <!-- 랜드마크 -->
      <g fill="#3157d5" fill-opacity="0.3">
        <circle cx="120" cy="180" r="3.5"/><circle cx="290" cy="470" r="3.5"/>
        <circle cx="430" cy="330" r="3.5"/><circle cx="150" cy="600" r="3.5"/>
        <circle cx="470" cy="470" r="3.5"/><circle cx="330" cy="60" r="3.5"/>
        <circle cx="60" cy="330" r="3.5"/><circle cx="400" cy="560" r="3.5"/>
      </g>
    </g>
  </svg>

  <div class="top"><div class="mark">YJ</div><div class="name">Yoo Juno</div></div>
  <div class="mid">
    <div class="eyebrow">Robotics · Computer Vision · Embedded</div>
    <h1>유준호</h1>
    <div class="rule"></div>
    <div class="lead">ROS2 자율주행, 컴퓨터 비전, 임베디드 시스템을 개발합니다.</div>
  </div>
  <div class="bot">
    <div class="url">yoojuno.github.io</div>
    <div class="tags"><span>ROS2</span><span>SLAM</span><span>Embedded</span></div>
  </div>
</div></body></html>
