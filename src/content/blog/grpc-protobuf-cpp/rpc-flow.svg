<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-labelledby="title desc">
  <title id="title">Protobuf와 gRPC의 코드 생성 및 호출 흐름</title>
  <desc id="desc">proto 정의에서 클라이언트와 서버 코드를 생성한다. 실행 중 요청 메시지는 직렬화되어 HTTP/2로 서버에 전달되고 응답은 반대 방향으로 돌아온다.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/></marker></defs>
  <rect width="680" height="400" fill="#fff"/>
  <g fill="none" stroke="#555" stroke-width="1.5">
    <rect x="245" y="22" width="190" height="50" rx="4"/>
    <path d="M 290 72 V 104 H 145 V 139 M 390 72 V 104 H 535 V 139" marker-end="url(#arrow)"/>
    <rect x="34" y="148" width="222" height="182" rx="4"/>
    <rect x="424" y="148" width="222" height="182" rx="4"/>
    <path d="M 256 218 H 424" marker-end="url(#arrow)"/>
    <path d="M 424 287 H 256" marker-end="url(#arrow)"/>
  </g>
  <g fill="#202020" font-family="system-ui, sans-serif" text-anchor="middle">
    <text x="340" y="54" font-size="23" font-weight="600">frames.proto</text>
    <text x="145" y="126" font-size="17">generated code</text>
    <text x="535" y="126" font-size="17">generated code</text>
    <text x="145" y="185" font-size="25" font-weight="600">Client</text>
    <text x="145" y="231" font-size="20">Stub</text>
    <text x="145" y="274" font-size="18">Request / Response</text>
    <text x="145" y="303" font-size="18">Protobuf messages</text>
    <text x="535" y="185" font-size="25" font-weight="600">Server</text>
    <text x="535" y="231" font-size="20">Service handler</text>
    <text x="535" y="274" font-size="18">Request / Response</text>
    <text x="535" y="303" font-size="18">Protobuf messages</text>
    <text x="340" y="203" font-size="18">request</text>
    <text x="340" y="272" font-size="18">response</text>
    <text x="340" y="370" font-size="22">gRPC transport: HTTP/2</text>
  </g>
</svg>
