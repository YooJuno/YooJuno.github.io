<svg xmlns="http://www.w3.org/2000/svg" width="640" height="260" viewBox="0 0 640 260" role="img" aria-labelledby="title desc">
  <title id="title">LiDAR 반사점을 거리 영상에 놓는 방법</title>
  <desc id="desc">같은 방위각의 인접한 두 빔이 지면의 A와 B에 닿는다. 두 점을 이은 선과 수평 기준선의 각도로 지면을 판별한다. 거리 영상에서 A와 B는 한 열의 이웃한 두 행을 차지한다.</desc>
