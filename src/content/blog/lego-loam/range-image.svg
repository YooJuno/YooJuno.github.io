    <path d="M151 195H270" fill="none" stroke="#808080" stroke-width="1.4" stroke-dasharray="5 4"/>
    <path d="M87 99L151 195M87 99L249 183" fill="none" stroke="#8a8a8a" stroke-width="1.7"/>
    <path d="M151 195L249 183" stroke="#252525" stroke-width="2"/>
