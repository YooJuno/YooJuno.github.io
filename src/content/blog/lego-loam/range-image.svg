    <circle cx="151" cy="195" r="4.5"/>
    <circle cx="249" cy="183" r="4.5"/>
    <g font-size="19">
      <text x="151" y="225">A</text>
      <text x="254" y="164">B</text>
      <text x="67" y="238">지면</text>
    </g>
    <path d="M304 140H333M325 132L333 140L325 148" fill="none" stroke="#686868" stroke-width="1.5"/>
    <rect x="374" y="75" width="210" height="130" fill="#f8f8f8"/>
