<svg xmlns="http://www.w3.org/2000/svg" width="680" height="932" viewBox="0 0 680 932" role="img" aria-labelledby="title description">
<title id="title">JWT 인증의 발급·검증·갱신</title>
<desc id="description">클라이언트가 인증 서버에서 토큰을 발급받고 액세스 토큰으로 API에 접근한다. API는 서명과 클레임 및 권한을 확인한다. 리프레시 토큰은 별도 갱신 흐름에서 인증 서버로만 전달한다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6c7e9c"/></marker></defs>
<rect width="680" height="932" rx="18" fill="#f5f7fc"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<text x="40" y="51" font-size="28" fill="#172339" font-weight="700">JWT 인증의 발급·검증·갱신</text>
<text x="40" y="85" font-size="21" fill="#52617a" font-weight="400">토큰 저장 위치나 전송 수단을 지정하지 않는 개념도</text>
<rect x="40" y="123" width="600" height="100" rx="14" fill="#fff" stroke="#d8e0ee" stroke-width="1.5"/><text x="64" y="159" font-size="24" fill="#172339" font-weight="700">01  클라이언트 → 인증 서버</text><text x="64" y="193" font-size="22" fill="#52617a" font-weight="400">로그인 등 서비스가 정한 인증 절차 수행</text>
<path d="M 340 223 V 251" fill="none" stroke="#6c7e9c" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="253" width="600" height="100" rx="14" fill="#edf1ff" stroke="#c4cff5" stroke-width="1.5"/><text x="64" y="289" font-size="24" fill="#172339" font-weight="700">02  인증 서버 → 클라이언트</text><text x="64" y="323" font-size="22" fill="#52617a" font-weight="400">Access Token 발급 · 필요하면 Refresh Token 발급</text>
<path d="M 340 353 V 381" fill="none" stroke="#6c7e9c" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="383" width="600" height="100" rx="14" fill="#fff" stroke="#d8e0ee" stroke-width="1.5"/><text x="64" y="419" font-size="24" fill="#172339" font-weight="700">03  클라이언트 → 리소스 API</text><text x="64" y="453" font-size="22" fill="#52617a" font-weight="400">API 요청에 Access Token 전달</text>
<path d="M 340 483 V 511" fill="none" stroke="#6c7e9c" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="513" width="600" height="130" rx="14" fill="#fff" stroke="#d8e0ee" stroke-width="1.5"/><text x="64" y="549" font-size="24" fill="#172339" font-weight="700">04  API가 검증한 뒤 권한 판단</text><text x="64" y="583" font-size="22" fill="#52617a" font-weight="400">허용 알고리즘·키·서명·iss·aud·exp 등 확인</text><text x="64" y="613" font-size="22" fill="#52617a" font-weight="400">토큰이 유효해도 요청 권한이 없으면 거절</text>
<text x="40" y="696" font-size="23" fill="#15786f" font-weight="700">별도 흐름  토큰 갱신</text>
<rect x="40" y="719" width="600" height="130" rx="14" fill="#eaf4f1" stroke="#c4ded6" stroke-width="1.5"/><text x="64" y="755" font-size="24" fill="#172339" font-weight="700">Refresh Token → 인증 서버</text><text x="64" y="789" font-size="22" fill="#52617a" font-weight="400">정책에 따라 회전·폐기·재사용 탐지</text><text x="64" y="819" font-size="22" fill="#52617a" font-weight="400">일반 리소스 API에 Refresh Token을 보내지 않음</text>
<text x="40" y="894" font-size="21" fill="#52617a" font-weight="400">Access Token과 Refresh Token이 모두 JWT일 필요는 없음</text>
</g>
</svg>
