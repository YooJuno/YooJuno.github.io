<svg xmlns="http://www.w3.org/2000/svg" width="680" height="910" viewBox="0 0 680 910" role="img" aria-labelledby="title description">
<title id="title">CORS: 요청과 응답 공개를 구분하기</title>
<desc id="description">프리플라이트가 없는 요청은 서버 처리 후 응답 공개 여부를 검사한다. 프리플라이트 대상 요청은 OPTIONS 정책 확인을 통과한 뒤 실제 요청을 보내며 그 응답도 CORS 검사를 받는다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6c7e9c"/></marker></defs>
<rect width="680" height="910" rx="18" fill="#f5f7fc"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<text x="40" y="51" font-size="28" fill="#172339" font-weight="700">CORS: 요청과 응답 공개를 구분하기</text>
<text x="40" y="85" font-size="21" fill="#52617a" font-weight="400">브라우저가 JavaScript에 응답을 공개하는 규칙</text>
<text x="40" y="137" font-size="23" fill="#345dde" font-weight="700">01  프리플라이트 없는 요청</text>
<rect x="40" y="158" width="600" height="100" rx="14" fill="#fff" stroke="#d8e0ee" stroke-width="1.5"/><text x="64" y="194" font-size="24" fill="#172339" font-weight="700">실제 요청 전송 → 서버 처리</text><text x="64" y="228" font-size="22" fill="#52617a" font-weight="400">요청이 서버에 도달하고 작업이 실행될 수 있음</text>
<path d="M 340 258 V 286" fill="none" stroke="#6c7e9c" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="288" width="600" height="100" rx="14" fill="#fff" stroke="#d8e0ee" stroke-width="1.5"/><text x="64" y="324" font-size="24" fill="#172339" font-weight="700">응답을 받은 브라우저가 CORS 검사</text><text x="64" y="358" font-size="22" fill="#52617a" font-weight="400">허용된 Origin이면 JavaScript에 응답 공개</text>
<text x="48" y="425" font-size="23" fill="#15786f" font-weight="700">응답 차단 ≠ 서버 작업 취소</text>
<text x="40" y="492" font-size="23" fill="#345dde" font-weight="700">02  프리플라이트 대상 요청</text>
<rect x="40" y="513" width="600" height="100" rx="14" fill="#fff" stroke="#d8e0ee" stroke-width="1.5"/><text x="64" y="549" font-size="24" fill="#172339" font-weight="700">먼저 OPTIONS로 정책 확인</text><text x="64" y="583" font-size="22" fill="#52617a" font-weight="400">실제 요청의 메서드·헤더 등이 허용되는지 확인</text>
<path d="M 340 613 V 641" fill="none" stroke="#6c7e9c" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="643" width="600" height="100" rx="14" fill="#fff" stroke="#d8e0ee" stroke-width="1.5"/><text x="64" y="679" font-size="24" fill="#172339" font-weight="700">허용되면 실제 요청 전송</text><text x="64" y="713" font-size="22" fill="#52617a" font-weight="400">실제 응답도 CORS 검사를 통과해야 공개됨</text>
<rect x="40" y="777" width="600" height="100" rx="14" fill="#eaf4f1" stroke="#c4ded6" stroke-width="1.5"/>
<text x="64" y="815" font-size="23" fill="#15786f" font-weight="700">자격 증명을 포함하는 요청</text>
<text x="64" y="849" font-size="22" fill="#52617a" font-weight="400">정확한 허용 Origin + 별도의 쿠키 정책 확인</text>
</g>
</svg>
