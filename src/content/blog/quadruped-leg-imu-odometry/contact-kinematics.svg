<svg xmlns="http://www.w3.org/2000/svg" width="680" height="780" viewBox="0 0 680 780" role="img" aria-labelledby="title desc">
  <title id="title">접촉 발과 몸체 상대 위치의 변화</title>
  <desc id="desc">몸체와 한 발 접촉점의 병진 운동을 표시한 측면 개념도다. 두 시점에서 발은 같은 지면 위치에 있고 몸체는 전진한다. 몸체 기준 발의 전방 상대 거리는 줄어든다. 회전에 따른 속도 항은 본문의 별도 식에 포함한다.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 7 4 0 8" fill="none" stroke="#3157d5" stroke-width="1.5"/></marker>
    <style>
      text{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;fill:#172339}.title{font-size:29px;font-weight:750}.label{font-size:24px;font-weight:700}.note{font-size:21px;fill:#526178}.panel{fill:#fff;stroke:#d8e0ed;stroke-width:1.5}.vector{fill:none;stroke:#3157d5;stroke-width:2.5;stroke-dasharray:7 5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="680" height="780" rx="20" fill="#f5f7fc"/>
  <text x="34" y="53" class="title">접촉 발 · 몸체 상대 위치</text>
  <text x="34" y="87" class="note">몸체 · 접촉점의 측면 예시 · 병진 운동</text>
  <rect x="34" y="118" width="612" height="260" rx="14" class="panel"/>
  <text x="58" y="153" class="label">t₀</text>
  <line x1="72" y1="345" x2="614" y2="345" stroke="#acb6c7" stroke-width="2"/>
  <rect x="160" y="188" width="180" height="56" rx="10" fill="#eef2ff" stroke="#bfcbed"/>
  <text x="250" y="214" text-anchor="middle" class="note">몸체 B₀</text>
  <path d="M250 230L491 336" class="vector"/>
  <circle cx="250" cy="230" r="5" fill="#3157d5"/>
  <circle cx="500" cy="340" r="8" fill="#15887e"/>
  <text x="391" y="252" class="note">r_B(t₀)</text>
  <text x="520" y="336" class="note">접촉 발</text>
  <text x="340" y="411" text-anchor="middle" class="note">발의 지면 기준 위치는 동일</text>
  <rect x="34" y="434" width="612" height="260" rx="14" class="panel"/>
  <text x="58" y="469" class="label">t₁</text>
  <line x1="72" y1="661" x2="614" y2="661" stroke="#acb6c7" stroke-width="2"/>
  <rect x="230" y="504" width="180" height="56" rx="10" fill="#eef2ff" stroke="#bfcbed"/>
  <text x="320" y="530" text-anchor="middle" class="note">몸체 B₁</text>
  <path d="M320 546L491 650" class="vector"/>
  <circle cx="320" cy="546" r="5" fill="#3157d5"/>
  <circle cx="500" cy="656" r="8" fill="#15887e"/>
  <text x="433" y="568" class="note">r_B(t₁)</text>
  <text x="520" y="652" class="note">접촉 발</text>
  <path d="M250 488H314" fill="none" stroke="#3157d5" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="355" y="492" class="note">몸체 전진</text>
  <text x="340" y="741" text-anchor="middle" class="note">상대 위치 변화 + 회전 항 → 몸체 속도</text>
</svg>
