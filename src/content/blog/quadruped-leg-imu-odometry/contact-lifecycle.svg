<svg xmlns="http://www.w3.org/2000/svg" width="680" height="850" viewBox="0 0 680 850" role="img" aria-labelledby="title desc">
  <title id="title">발 접촉 전환과 추정기 처리</title>
  <desc id="desc">Swing에서 고정 발 관측을 제외하고 touchdown에서 새 접촉점을 구성한다. Stance에서는 기구학 관측으로 보정하며 미끄럼을 감시하고 liftoff에서 고정 제약을 해제한다. 상태 제거 또는 잡음 확대는 필터에 따라 다르다.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 7 4 0 8" fill="none" stroke="#303030" stroke-width="1.5"/></marker>
    <style>
      text{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;fill:#202124}.title{font-size:25px;font-weight:750}.label{font-size:24px;font-weight:700}.note{font-size:21px;fill:#555555}.panel{fill:#fff;stroke:#dfdfdf;stroke-width:1.5}.arrow{fill:none;stroke:#303030;stroke-width:2.5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="680" height="850" rx="4" fill="#ffffff"/>
  <text x="34" y="53" class="title">발 접촉 · 상태 전환</text>
  <text x="34" y="87" class="note">발 ID별 접촉점과 관측의 관리</text>
  <rect x="66" y="122" width="580" height="120" rx="4" class="panel"/>
  <text x="90" y="157" class="label">1 Swing · 발 이동</text>
  <text x="90" y="193" class="note">IMU 예측 유지</text>
  <text x="90" y="226" class="note">고정 발 관측: 미사용</text>
  <path d="M340 242V288" class="arrow"/>
  <rect x="66" y="298" width="580" height="120" rx="4" class="panel"/>
  <text x="90" y="333" class="label">2 Touchdown · 착지</text>
  <text x="90" y="369" class="note">새 접촉점: d = p + R·FK(q)</text>
  <text x="90" y="402" class="note">몸체와의 교차 공분산 반영</text>
  <path d="M340 418V464" class="arrow"/>
  <rect x="66" y="474" width="580" height="120" rx="4" fill="#f4f4f4" stroke="#d4d4d4" stroke-width="1.5"/>
  <text x="90" y="509" class="label">3 Stance · 지지</text>
  <text x="90" y="545" class="note">FK 위치 잔차로 보정</text>
  <text x="90" y="578" class="note">발별 잔차 · 미끄럼 감시</text>
  <path d="M340 594V640" class="arrow"/>
  <rect x="66" y="650" width="580" height="120" rx="4" class="panel"/>
  <text x="90" y="685" class="label">4 Liftoff · 발 떼기</text>
  <text x="90" y="721" class="note">해당 발의 고정 제약 해제</text>
  <text x="90" y="754" class="note">접촉점 제거 또는 과정 잡음 확대</text>
  <path d="M66 710H30V182H56" class="arrow"/>
  <text x="340" y="818" text-anchor="middle" class="note">필터별 접촉 상태 관리 방식 확인</text>
</svg>
