<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1000" viewBox="0 0 680 1000" role="img" aria-labelledby="title desc">
  <title id="title">RPP, DWB, MPPI의 제어 방식 비교</title>
  <desc id="desc">RPP는 lookahead 목표점으로 향하는 곡률을 계산하고, DWB는 후보 궤적 중 점수가 좋은 명령을 선택한다. MPPI는 여러 입력 시퀀스의 비용을 이용해 제어 시퀀스를 갱신한다.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 7 4 0 8" fill="none" stroke="#345dde" stroke-width="1.5"/></marker>
    <style>
      text{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;fill:#172339}
      .title{font-size:30px;font-weight:750}.label{font-size:25px;font-weight:700}.note{font-size:21px;fill:#526178}
      .panel{fill:#fff;stroke:#d8e0ed;stroke-width:1.5}.path{fill:none;stroke:#a4afbf;stroke-width:3;stroke-dasharray:7 5}
      .selected{fill:none;stroke:#345dde;stroke-width:4;stroke-linecap:round}.sample{fill:none;stroke:#9bb0da;stroke-width:2.5}
    </style>
  </defs>
  <rect width="680" height="1000" rx="20" fill="#f5f7fc"/>
  <text x="34" y="53" class="title">경로를 명령으로 바꾸는 세 방식</text>
  <text x="34" y="85" class="note">점선: 주어진 Path  /  파란색: 추종·갱신 개념</text>
  <rect x="34" y="111" width="612" height="258" rx="14" class="panel"/>
  <text x="55" y="149" class="label">RPP  ·  목표점의 기하 + 속도 조절</text>
  <path d="M75 300 C170 300 178 208 300 208" class="path"/>
  <path d="M75 300 Q151 300 229 230" class="selected"/>
  <path d="M75 300 229 230" fill="none" stroke="#15a295" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="229" cy="230" r="9" fill="#eaf6f2" stroke="#15887e" stroke-width="3"/>
  <path d="M64 289 86 300 64 311 Z" fill="#345dde"/>
  <text x="122" y="245" class="note">lookahead</text>
  <text x="352" y="214" class="note">목표점 → 곡률</text>
  <text x="352" y="250" class="note">곡률·비용 → 감속</text>
  <text x="352" y="286" class="note">충돌 예상 → 정지</text>
  <text x="55" y="346" class="note">기본 RPP: 막힌 길의 우회는 재계획과 함께 처리</text>
  <rect x="34" y="389" width="612" height="258" rx="14" class="panel"/>
  <text x="55" y="427" class="label">DWB  ·  후보 궤적의 점수 비교</text>
  <path d="M75 569 C177 569 207 485 307 485" class="path"/>
  <path d="M75 569 H306 M75 569 Q170 569 289 603 M75 569 Q160 569 248 462 M75 569 Q160 569 298 535" class="sample"/>
  <path d="M75 569 Q153 569 293 499" class="selected"/>
  <circle cx="245" cy="568" r="19" fill="#fae6de" stroke="#ce947c" stroke-width="2"/>
  <path d="M64 558 86 569 64 580 Z" fill="#345dde"/>
  <text x="352" y="492" class="note">속도 후보 → rollout</text>
  <text x="352" y="528" class="note">Critic으로 비용 평가</text>
  <text x="352" y="564" class="note">좋은 후보 명령 선택</text>
  <text x="55" y="624" class="note">후보 생성 범위와 가속도 처리는 generator에 의존</text>
  <rect x="34" y="667" width="612" height="258" rx="14" class="panel"/>
  <text x="55" y="705" class="label">MPPI  ·  입력 시퀀스를 비용으로 갱신</text>
  <path d="M75 847 C162 847 193 762 308 762" class="path"/>
  <path d="M75 847 C150 871 213 837 304 808 M75 847 C131 824 213 807 303 784 M75 847 C136 834 179 743 296 742 M75 847 C160 830 224 850 306 836 M75 847 C176 866 214 788 307 773" class="sample"/>
  <path d="M75 847 C158 842 209 789 304 779" class="selected"/>
  <path d="M64 836 86 847 64 858 Z" fill="#345dde"/>
  <text x="352" y="770" class="note">잡음으로 후보 생성</text>
  <text x="352" y="806" class="note">비용 기반 가중 갱신</text>
  <text x="352" y="842" class="note">첫 입력 실행 후 반복</text>
  <text x="55" y="902" class="note">갱신 후 제약·유효성 처리도 필요 · 전역 최적 보장 아님</text>
  <text x="340" y="970" text-anchor="middle" class="note">개념도 · 실제 샘플 수·장애물 비용·성능 비교 아님</text>
</svg>
