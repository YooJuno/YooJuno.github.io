<svg xmlns="http://www.w3.org/2000/svg" width="680" height="820" viewBox="0 0 680 820" role="img" aria-labelledby="title description">
  <title id="title">GitHub Actions의 Pages 배포 흐름</title>
  <desc id="description">main push 또는 수동 실행으로 Workflow가 시작된다. 빌드 Job이 소스와 Node 환경을 준비하고 설치, 검사, 빌드 후 dist를 Artifact로 업로드한다. 별도 Runner의 배포 Job은 needs로 build의 성공을 확인한 뒤 해당 결과물을 GitHub Pages에 배포한다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#777777"/>
    </marker>
  </defs>
  <rect width="680" height="820" rx="4" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="40" y="52" font-size="28" font-weight="700" fill="#202124">GitHub Actions의 Pages 배포</text>
    <text x="40" y="87" font-size="21" fill="#555555">이벤트 → 빌드 → 결과물 → 배포</text>
    <rect x="40" y="119" width="600" height="92" rx="4" fill="#fff" stroke="#dfdfdf" stroke-width="1.5"/>
    <text x="64" y="155" font-size="24" font-weight="700" fill="#202124">main push / 수동 실행</text>
    <text x="64" y="188" font-size="22" fill="#555555">on 조건에 맞는 Workflow 시작</text>
    <rect x="40" y="252" width="600" height="164" rx="4" fill="#fff" stroke="#dfdfdf" stroke-width="1.5"/>
    <text x="64" y="290" font-size="24" font-weight="700" fill="#202124">build Job · Runner A</text>
    <text x="64" y="331" font-size="22" fill="#555555">checkout → setup-node → npm ci</text>
    <text x="64" y="370" font-size="22" fill="#555555">lint → build → upload artifact</text>
    <rect x="40" y="457" width="600" height="94" rx="4" fill="#f1f1f1" stroke="#cfcfcf" stroke-width="1.5"/>
    <text x="64" y="494" font-size="24" font-weight="700" fill="#202124">Artifact · dist/</text>
    <text x="64" y="528" font-size="22" fill="#555555">빌드한 결과물을 저장·전달</text>
    <rect x="40" y="592" width="600" height="105" rx="4" fill="#f2f2f2" stroke="#d8d8d8" stroke-width="1.5"/>
    <text x="64" y="631" font-size="24" font-weight="700" fill="#202124">deploy Job · Runner B</text>
    <text x="64" y="667" font-size="22" fill="#555555">needs: build 성공 후 Pages 배포</text>
    <g fill="none" stroke="#777777" stroke-width="2.5" marker-end="url(#arrow)">
      <path d="M 340 213 V 249"/>
      <path d="M 340 418 V 454"/>
      <path d="M 340 553 V 589"/>
    </g>
    <text x="40" y="754" font-size="23" font-weight="700" fill="#303030">needs는 실행 순서, Artifact는 파일 전달</text>
    <text x="40" y="791" font-size="21" fill="#555555">검사 성공·배포 성공·서비스 정상 동작은 별도 확인</text>
  </g>
</svg>
