<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">Jenkins Pipeline Stages</title>
  <desc id="desc">Pipeline stages used for backend and frontend in a monorepo.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="stage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#93c5fd"/>
    </marker>
    <style>
      .title { font: 700 40px 'Segoe UI', Arial, sans-serif; fill: #f8fafc; }
      .subtitle { font: 500 20px 'Segoe UI', Arial, sans-serif; fill: #cbd5e1; }
      .box { fill: url(#stage); stroke: #334155; stroke-width: 2; rx: 14; }
      .box-title { font: 700 18px 'Segoe UI', Arial, sans-serif; fill: #e2e8f0; }
      .box-text { font: 500 15px 'Segoe UI', Arial, sans-serif; fill: #94a3b8; }
      .line { stroke: #93c5fd; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1280" height="520" fill="url(#bg)"/>
  <text x="60" y="70" class="title">Example Pipeline Flow</text>
  <text x="60" y="102" class="subtitle">Monorepo: Spring Boot backend + React frontend</text>

  <rect x="60" y="170" width="170" height="130" class="box"/>
  <text x="145" y="210" text-anchor="middle" class="box-title">1. Checkout</text>
  <text x="145" y="238" text-anchor="middle" class="box-text">checkout scm</text>

  <rect x="255" y="170" width="180" height="130" class="box"/>
  <text x="345" y="210" text-anchor="middle" class="box-title">2. Toolchain</text>
  <text x="345" y="238" text-anchor="middle" class="box-text">java / node verify</text>

  <rect x="460" y="170" width="190" height="130" class="box"/>
  <text x="555" y="210" text-anchor="middle" class="box-title">3. Backend Test</text>
  <text x="555" y="238" text-anchor="middle" class="box-text">gradlew test</text>

  <rect x="675" y="170" width="210" height="130" class="box"/>
  <text x="780" y="210" text-anchor="middle" class="box-title">4. Frontend</text>
  <text x="780" y="238" text-anchor="middle" class="box-text">npm ci / lint / build</text>

  <rect x="910" y="170" width="165" height="130" class="box"/>
  <text x="992" y="210" text-anchor="middle" class="box-title">5. Package</text>
  <text x="992" y="238" text-anchor="middle" class="box-text">bootJar</text>

  <rect x="1100" y="170" width="130" height="130" class="box"/>
  <text x="1165" y="210" text-anchor="middle" class="box-title">6. Deploy</text>
  <text x="1165" y="238" text-anchor="middle" class="box-text">SSH</text>

  <path d="M 230 235 L 255 235" class="line"/>
  <path d="M 435 235 L 460 235" class="line"/>
  <path d="M 650 235 L 675 235" class="line"/>
  <path d="M 885 235 L 910 235" class="line"/>
  <path d="M 1075 235 L 1100 235" class="line"/>

  <text x="60" y="380" class="subtitle">Deploy stage can be gated by branch == main and DEPLOY=true parameter.</text>
</svg>
