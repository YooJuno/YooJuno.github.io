<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="chart-title chart-description">
  <title id="chart-title">이동량 적분 방식에 따른 LiDAR 표면 간격</title>
  <desc id="chart-description">이동 증분 전체 회전과 횡이동을 기준으로 한 보정에서 같은 3,732개 스캔으로 맞춘 네 간격을 비교한다. 지도 하단부터 A에서 D까지 표시한다. D는 0.636 m에서 1.861 m로 바뀌었다.</desc>
  <rect x="0.5" y="0.5" width="639" height="399" rx="13" fill="#fff" stroke="#d7d7d7"/>
  <defs>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#fff"/>
      <path d="M0 0V7" stroke="#6a6a6a" stroke-width="2.6"/>
    </pattern>
  </defs>
  <g font-family="'Nanum Gothic', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <text x="26" y="42" font-size="26" fill="#252525" text-anchor="start" font-weight="700">LiDAR 표면 간격 (m)</text>
  <rect x="28" y="64" width="19" height="12" rx="2" fill="url(#hatch)" stroke="#6a6a6a"/>
  <text x="57" y="78" font-size="22" fill="#252525" text-anchor="start">이동 증분 전체 회전</text>
  <rect x="318" y="64" width="19" height="12" rx="2" fill="#353535"/>
  <text x="347" y="78" font-size="22" fill="#252525" text-anchor="start">횡이동 기준 보정</text>
  <line x1="87.0" y1="98" x2="87.0" y2="351" stroke="#d7d7d7" stroke-width="1"/>
  <text x="87.0" y="379" font-size="21" fill="#515151" text-anchor="middle">0</text>
  <line x1="175.0" y1="98" x2="175.0" y2="351" stroke="#d7d7d7" stroke-width="1"/>
  <text x="175.0" y="379" font-size="21" fill="#515151" text-anchor="middle">0.5</text>
  <line x1="263.0" y1="98" x2="263.0" y2="351" stroke="#d7d7d7" stroke-width="1"/>
  <text x="263.0" y="379" font-size="21" fill="#515151" text-anchor="middle">1</text>
  <line x1="351.0" y1="98" x2="351.0" y2="351" stroke="#d7d7d7" stroke-width="1"/>
  <text x="351.0" y="379" font-size="21" fill="#515151" text-anchor="middle">1.5</text>
  <line x1="439.0" y1="98" x2="439.0" y2="351" stroke="#d7d7d7" stroke-width="1"/>
  <text x="439.0" y="379" font-size="21" fill="#515151" text-anchor="middle">2</text>
  <line x1="527.0" y1="98" x2="527.0" y2="351" stroke="#d7d7d7" stroke-width="1"/>
  <text x="527.0" y="379" font-size="21" fill="#515151" text-anchor="middle">2.5</text>
  <text x="40" y="135" font-size="25" fill="#252525" text-anchor="start" font-weight="700">A</text>
  <rect x="87" y="108" width="251.92" height="15" rx="2" fill="url(#hatch)" stroke="#6a6a6a"/>
  <text x="349.92" y="123" font-size="22" fill="#252525" text-anchor="start">1.431</text>
  <rect x="87" y="134" width="350.47" height="15" rx="2" fill="#353535"/>
  <text x="448.47" y="149" font-size="22" fill="#252525" text-anchor="start">1.991</text>
  <text x="40" y="196" font-size="25" fill="#252525" text-anchor="start" font-weight="700">B</text>
  <rect x="87" y="169" width="380.1" height="15" rx="2" fill="url(#hatch)" stroke="#6a6a6a"/>
  <text x="478.1" y="184" font-size="22" fill="#252525" text-anchor="start">2.160</text>
  <rect x="87" y="195" width="374.45" height="15" rx="2" fill="#353535"/>
  <text x="472.45" y="210" font-size="22" fill="#252525" text-anchor="start">2.128</text>
  <text x="40" y="257" font-size="25" fill="#252525" text-anchor="start" font-weight="700">C</text>
  <rect x="87" y="230" width="435.42" height="15" rx="2" fill="url(#hatch)" stroke="#6a6a6a"/>
  <text x="533.42" y="245" font-size="22" fill="#252525" text-anchor="start">2.474</text>
