<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1060" viewBox="0 0 680 1060" role="img" aria-labelledby="title desc">
  <title id="title">GSeg3D와 FugSeg의 처리 흐름</title>
  <desc id="desc">GSeg3D의 공식 ROS 2 구현은 큰 z 셀로 남긴 지면 후보를 작은 z 셀로 다시 정제한다. FugSeg는 극좌표 격자에서 거리 방향과 횡방향 지면 라벨링 후 높이 추정과 점 단위 분리를 수행한다.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 7 4 0 8" fill="none" stroke="#303030" stroke-width="1.5"/></marker>
    <style>
      text{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;fill:#202124}.title{font-size:25px;font-weight:750}.label{font-size:24px;font-weight:700}.note{font-size:21px;fill:#555555}.small{font-size:19px;fill:#555555}.node{fill:#fff;stroke:#dfdfdf;stroke-width:1.5}.arrow{fill:none;stroke:#303030;stroke-width:2.5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="680" height="1060" rx="4" fill="#ffffff"/>
  <text x="34" y="53" class="title">지면 분리 처리 흐름</text>
  <text x="34" y="87" class="note">알고리즘 구조 비교 · 성능 순위 아님</text>
  <rect x="34" y="116" width="612" height="376" rx="4" fill="#f2f2f2" stroke="#dfdfdf"/>
  <text x="58" y="156" class="label">GSeg3D · 공식 ROS 2 wrapper</text>
  <rect x="64" y="180" width="552" height="85" rx="4" class="node"/>
  <text x="88" y="214" class="label">1차 · 큰 z 셀</text>
  <text x="88" y="245" class="note">국소 기하 · 평면 · seed 연결</text>
  <path d="M340 265V296" class="arrow"/>
  <text x="351" y="288" class="small">지면 후보만</text>
  <rect x="64" y="307" width="552" height="85" rx="4" class="node"/>
  <text x="88" y="341" class="label">2차 · 작은 z 셀</text>
  <text x="88" y="372" class="note">수직 해상도 · 점별 조건으로 정제</text>
  <path d="M220 392V418" class="arrow"/>
  <path d="M480 392V418" class="arrow"/>
  <path d="M616 222H631V450H618" fill="none" stroke="#7d7d7d" stroke-width="2"/>
  <rect x="64" y="429" width="252" height="43" rx="4" fill="#efefef" stroke="#d2d2d2"/>
  <rect x="364" y="429" width="252" height="43" rx="4" fill="#f3f3f3" stroke="#d2d2d2"/>
  <text x="190" y="458" text-anchor="middle" class="note">최종 지면</text>
  <text x="490" y="457" text-anchor="middle" class="small">1차 + 2차 비지면</text>
  <rect x="34" y="518" width="612" height="489" rx="4" fill="#f4f4f4" stroke="#dfdfdf"/>
  <text x="58" y="558" class="label">FugSeg · 극좌표 격자</text>
  <rect x="64" y="582" width="552" height="78" rx="4" class="node"/>
  <text x="88" y="615" class="label">PGM</text>
  <text x="88" y="645" class="note">방위각·거리 셀 · 낮은 대표점</text>
  <path d="M340 660V688" class="arrow"/>
  <rect x="64" y="699" width="552" height="92" rx="4" class="node"/>
  <text x="88" y="733" class="label">SGL + CGP</text>
  <text x="88" y="766" class="note">거리·횡방향 전파 · 불확실성 기반 기울기</text>
  <path d="M340 791V819" class="arrow"/>
  <rect x="64" y="830" width="552" height="92" rx="4" class="node"/>
  <text x="88" y="864" class="label">EGE + PGS</text>
  <text x="88" y="897" class="note">지면 높이 보간 · 각 점의 높이 차이 판정</text>
  <text x="64" y="963" class="note">셀 라벨과 최종 점 라벨은 별도</text>
  <text x="340" y="1037" text-anchor="middle" class="small">개념도 · 세부 유효성·예외 처리는 원문과 소스 참고</text>
</svg>
