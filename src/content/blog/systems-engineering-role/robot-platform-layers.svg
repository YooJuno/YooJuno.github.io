<svg xmlns="http://www.w3.org/2000/svg" width="680" height="860" viewBox="0 0 680 860" role="img" aria-labelledby="title description">
  <title id="title">로봇 플랫폼 계층 예시</title>
  <desc id="description">애플리케이션, 공통 인터페이스, 장비별 구현, 실행 기반, 하드웨어를 연결한 플랫폼 설계 예시. 연결선은 계층 간 연동 관계를 나타내며 버전, 설정, 배포, 진단은 전체 구성을 관리한다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#6c7e9c"/>
    </marker>
  </defs>
  <rect width="680" height="860" rx="18" fill="#f5f7fc"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="40" y="51" font-size="28" fill="#172339" font-weight="700">로봇 플랫폼 계층 예시</text>
    <text x="40" y="85" font-size="21" fill="#52617a">애플리케이션과 장비별 구현을 분리하는 구조</text>
    <g fill="#fff" stroke="#d8e0ee" stroke-width="1.5">
      <rect x="40" y="123" width="600" height="100" rx="14"/>
      <rect x="40" y="255" width="600" height="100" rx="14"/>
      <rect x="40" y="387" width="600" height="100" rx="14"/>
    </g>
    <rect x="40" y="519" width="600" height="100" rx="14" fill="#edf1ff" stroke="#c4cff5" stroke-width="1.5"/>
    <rect x="40" y="651" width="600" height="100" rx="14" fill="#eaf4f1" stroke="#c4ded6" stroke-width="1.5"/>
    <g font-size="24" fill="#172339" font-weight="700">
      <text x="64" y="159">애플리케이션</text>
      <text x="64" y="291">공통 인터페이스</text>
      <text x="64" y="423">장비별 구현</text>
      <text x="64" y="555">실행 기반</text>
      <text x="64" y="687">하드웨어</text>
    </g>
    <g font-size="22" fill="#52617a">
      <text x="64" y="193">SLAM·Navigation·인식·작업 계획</text>
      <text x="64" y="325">명령·상태·데이터·오류 규약</text>
      <text x="64" y="457">어댑터·제조사 SDK·사용자 공간 드라이버</text>
      <text x="64" y="589">OS·커널 드라이버·통신·런타임</text>
      <text x="64" y="721">컴퓨팅 보드·센서·기체 제어기·구동기</text>
    </g>
    <g fill="none" stroke="#6c7e9c" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)">
      <path d="M 340 227 V 251"/>
      <path d="M 340 359 V 383"/>
      <path d="M 340 491 V 515"/>
      <path d="M 340 623 V 647"/>
    </g>
    <text x="40" y="799" font-size="23" fill="#15786f" font-weight="700">전체 구성 관리: 버전·설정·배포·진단</text>
    <text x="40" y="834" font-size="21" fill="#52617a">장비·제어 구조에 따라 계층의 분리 범위 조정</text>
  </g>
</svg>
