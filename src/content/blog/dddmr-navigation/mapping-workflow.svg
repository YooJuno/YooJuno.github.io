<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 680" role="img" aria-labelledby="title desc">
  <title id="title">지도 제작 흐름</title>
  <desc id="desc">LiDAR 점을 거리 영상에 투영하고 지면을 검출한다. 모서리와 표면을 지도에 정합한 뒤 연속 자세와 Loop Closing 제약으로 키프레임 자세를 최적화한다.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#444"/>
    </marker>
    <pattern id="grid" width="40" height="24" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V24" fill="none" stroke="#9a9a9a" stroke-width="1.8"/>
    </pattern>
  </defs>
  <rect width="700" height="680" fill="#fff"/>
  <g fill="#232323" font-family="system-ui, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
    <text x="25" y="55" font-size="37" font-weight="700">지도 제작 흐름</text>
    <path d="M25 79H675M25 280H675M25 477H675" stroke="#c4c4c4" stroke-width="2"/>
    <g font-size="34" font-weight="700">
      <text x="25" y="132">거리 영상</text>
      <text x="25" y="329">특징점 정합</text>
      <text x="25" y="526">포즈 그래프</text>
    </g>
    <g font-size="30">
      <text x="25" y="175">행 · 수직각</text>
      <text x="25" y="215">열 · 방위각</text>
      <text x="25" y="255">이웃 점에서 지면 검출</text>
      <text x="25" y="372">모서리 → 선</text>
      <text x="25" y="412">표면 → 평면</text>
      <text x="25" y="452">초기값 · 오도메트리</text>
      <text x="25" y="570">연속 자세 · 실선</text>
      <text x="25" y="610">Loop Closing · 점선</text>
      <text x="25" y="650">키프레임 자세 최적화</text>
    </g>
    <rect x="415" y="120" width="240" height="96" fill="#fff"/>
    <path d="M415 192h40v-24h120v24h80v24H415Z" fill="#ddd"/>
    <path d="M495 120h40v48h-40Z" fill="#666"/>
    <g transform="translate(415 120)">
      <rect width="240" height="96" fill="url(#grid)" stroke="#666" stroke-width="2.4"/>
    </g>
    <g font-size="28">
      <text x="535" y="254" text-anchor="middle">방위각</text>
      <text transform="translate(392 211) rotate(-90)">수직각</text>
    </g>
    <g fill="none" stroke="#555" stroke-width="3">
      <path d="M394 405L502 341"/>
      <path d="M522 390L583 354L657 391L592 429Z" fill="#e4e4e4"/>
      <path d="M543 402L606 365M567 415L631 378M548 373L615 416M565 363L635 404" stroke="#888" stroke-width="2.2"/>
      <path d="M440 348L449 372M578 356L588 394" marker-end="url(#arrow)"/>
    </g>
    <g fill="#232323">
      <circle cx="437" cy="341" r="5.5"/>
      <circle cx="575" cy="348" r="5.5"/>
    </g>
    <g fill="none" stroke="#555" stroke-width="4">
      <path d="M389 623L450 592L514 604L581 633L650 591"/>
      <path d="M450 592Q540 507 650 591" stroke-dasharray="10 8"/>
    </g>
    <g fill="#fff" stroke="#444" stroke-width="4">
      <circle cx="389" cy="623" r="9"/>
      <circle cx="450" cy="592" r="9"/>
      <circle cx="514" cy="604" r="9"/>
      <circle cx="581" cy="633" r="9"/>
      <circle cx="650" cy="591" r="9"/>
    </g>
  </g>
</svg>
