<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220">
  <rect width="900" height="220" fill="#f7f7f2"/>
  <text x="30" y="30" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#222">Trading Styles by Holding Time</text>

  <line x1="50" y1="70" x2="850" y2="70" stroke="#333" stroke-width="2"/>
  <circle cx="120" cy="70" r="6" fill="#333"/>
  <circle cx="300" cy="70" r="6" fill="#333"/>
  <circle cx="500" cy="70" r="6" fill="#333"/>
  <circle cx="700" cy="70" r="6" fill="#333"/>

  <text x="90" y="105" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#222">Seconds</text>
  <text x="260" y="105" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#222">Hours</text>
  <text x="470" y="105" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#222">Days</text>
  <text x="670" y="105" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#222">Weeks+</text>

  <rect x="80" y="130" width="120" height="50" rx="8" fill="#fde2e2" stroke="#d33" stroke-width="1.5"/>
  <text x="95" y="160" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#222">Scalping</text>

  <rect x="230" y="130" width="150" height="50" rx="8" fill="#e2f0fd" stroke="#338" stroke-width="1.5"/>
  <text x="255" y="160" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#222">Day Trading</text>

  <rect x="430" y="130" width="140" height="50" rx="8" fill="#e8f7e4" stroke="#2a7" stroke-width="1.5"/>
  <text x="455" y="160" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#222">Swing</text>

  <rect x="620" y="130" width="170" height="50" rx="8" fill="#f1e7ff" stroke="#73a" stroke-width="1.5"/>
  <text x="650" y="160" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#222">Position</text>
</svg>
